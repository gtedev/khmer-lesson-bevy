[package]
name = "khmer-lesson-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.2"
indexmap = "2.13.0"
bevy = { version = "0.18", features = ["jpeg"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
    